<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <!-- Kandela in the menu bar (kandelaMark() in Sources/main.swift), on an 18×18 pt grid.
       Two rounded rectangles, both from y 4 to 14: the background window (x 1 to 9.5) in a
       1 pt outline with the three traffic-light dots (diameter 1.25), and a solid block
       (x 10.5 to 17) whose left side is a point entering the window, with a 1 pt gap cut
       around it. Edges fall on half points, i.e. whole pixels on Retina. -->
  <defs>
    <mask id="cut">
      <rect width="18" height="18" fill="#fff"/>
      <path d="M7 9 L10.28 4.32 C10.42 4.12 10.65 4 10.89 4 L16 4 C16.55 4 17 4.45 17 5 L17 13 C17 13.55 16.55 14 16 14 L10.89 14 C10.65 14 10.42 13.88 10.28 13.68 Z" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#cut)">
    <rect x="1.5" y="4.5" width="7.5" height="9" rx="1.5" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="3" cy="6.25" r=".625"/><circle cx="4.75" cy="6.25" r=".625"/><circle cx="6.5" cy="6.25" r=".625"/>
  </g>
  <path d="M7 9 L10.28 4.32 C10.42 4.12 10.65 4 10.89 4 L16 4 C16.55 4 17 4.45 17 5 L17 13 C17 13.55 16.55 14 16 14 L10.89 14 C10.65 14 10.42 13.88 10.28 13.68 Z" fill="#000"/>
</svg>
