<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- Kandela's app icon, the same as Resources/AppIcon.icns (generated by Tools/make-icon.swift).
       Tile on the macOS grid (84 wide inside 100, radius 19). The mark of
       Assets/kandela-mark.svg at scale 0.73, centered, lit: window outline and block in
       cream, the three dots in amber. -->
  <defs>
    <radialGradient id="tile" cx=".3" cy=".2" r="1.2">
      <stop offset="0" stop-color="#2a3350"/><stop offset=".7" stop-color="#0d1020"/>
    </radialGradient>
    <mask id="window">
      <rect x="8" y="25" width="44" height="50" rx="7" fill="#fff"/>
      <rect x="13" y="30" width="34" height="40" rx="4.5" fill="#000"/>
      <polygon points="36,50 55,25 92,25 92,75 55,75" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="84" height="84" rx="19" fill="url(#tile)"/>
  <g transform="translate(13.5 13.5) scale(.73)">
    <rect width="100" height="100" fill="#fff3dc" mask="url(#window)"/>
    <g fill="#e3a548"><circle cx="19.5" cy="36" r="2.2"/><circle cx="25.5" cy="36" r="2.2"/><circle cx="31.5" cy="36" r="2.2"/></g>
    <polygon points="41.02,50 56.98,29 88,29 88,71 56.98,71" fill="#fff3dc" stroke="#fff3dc" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
